    filter="url(#glow)">幕影记</text>
  <circle cx="816" cy="184" r="25" fill="none" stroke="#b52b1d" stroke-width="4"/>
  <path d="M801 184h30M816 169v30" stroke="#b52b1d" stroke-width="3" opacity=".8"/>
</svg>
