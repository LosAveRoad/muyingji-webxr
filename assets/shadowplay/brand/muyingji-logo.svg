    </filter>
  </defs>
  <path d="M72 36h816M72 224h816" stroke="#d4af37" stroke-width="2" opacity=".45"/>
  <path d="M112 58v144M848 58v144" stroke="#d4af37" stroke-width="4" opacity=".7"/>
  <text x="480" y="180" text-anchor="middle"
