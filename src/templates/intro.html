<a-entity
  id="mainLogo"
  geometry="primitive: plane; width: 9; height: 1.125"
  material="shader: flat; src: #logoImg; transparent: true; depthTest: false; blending: additive; opacity: 0"
  position="0 3.3 -2.5"
  rotation="0 0 0"
  scale="0.8 0.8 0.8"
  bind__visible="introActive"
  animation__opacity="property: components.material.material.opacity; from: 0; to: 1; dur: 2000; delay: 1000"
  animation__position="property: object3D.position.y; to: 3.4; dur: 2000; easing: easeInOutQuad; startEvents: startgame"></a-entity>

<a-entity
  id="startButton"
  bind__visible-raycastable="introActive"
  geometry="primitive: plane; width: 1; height: 0.35"
  position="0 1.6 -2.2"
  render-order="menu"
  proxy-event="event: click; to: a-scene; as: startgame"
  play-sound__hover="event: mouseenter; sound: #hoverSound; volume: 0.1"
  play-sound__click="event: click; sound: #confirmSound;  volume: 0.25"
  material="shader: flat; color: #050403; opacity: 0.96; transparent: true"
  animation="property: components.material.material.opacity; from: 0; to: 0.96; dur: 500; delay: 900">
  <a-image
    id="startButtonLabel"
    src="#startCalligraphyImg"
    width="0.58"
    height="0.28"
    position="0 0 0.01"
    material="shader: flat; transparent: true; opacity: 0"
    animation="property: components.material.material.opacity; from: 0; to: 1; dur: 500; delay: 1100"
    ></a-image>
</a-entity>
